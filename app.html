<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MK Painel Divulgação</title><style>body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}main{max-width:720px;margin:auto;padding:18px}.box{border:1px solid #f00;box-shadow:0 0 18px #600;padding:18px;margin:12px 0;border-radius:10px}h1,h2{color:#f22}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;background:#111;color:#fff;border:1px solid #900;border-radius:7px}button{background:#d00;font-weight:700;cursor:pointer}.muted{color:#aaa}.hidden{display:none}.item{border-top:1px solid #333;padding:12px 0}.qr{max-width:260px;background:#fff;padding:8px}.tabs button{width:49%}</style></head><body><main><h1>MK PAINEL DIVULGAÇÃO</h1><section id="login" class="box"><h2>Entrar</h2><input id="phone" placeholder="Telefone"><input id="password" type="password" placeholder="Senha"><button onclick="login()">ENTRAR</button><p id="msg" class="muted"></p></section><section id="panel" class="hidden"><div class="box"><b>Logado como:</b> <span id="who"></span><br><b>Saldo:</b> R$ <span id="balance">0,00</span><button onclick="logout()">SAIR</button></div><div class="tabs"><button onclick="show('pay')">ADICIONAR SALDO</button><button onclick="show('order')">DIVULGAR GRUPO</button></div><section id="pay" class="box"><h2>ADICIONAR SALDO</h2><select id="pkg"></select><input id="email" placeholder="E-mail do pagador"><input id="cpf" placeholder="CPF do pagador"><button onclick="pix()">FAZER PAGAMENTO PIX</button><div id="pixout"></div></section><section id="order" class="box hidden"><h2>DIVULGAR LINK DE GRUPO WHATSAPP</h2><input id="link" placeholder="https://chat.whatsapp.com/..."/><select id="opkg"></select><button onclick="order()">ENVIAR LINK</button></section><section class="box"><h2>MEUS PEDIDOS</h2><div id="orders"></div></section><section id="admin" class="box hidden"><h2>ADMINISTRAÇÃO</h2><input id="newphone" placeholder="Telefone do usuário"><input id="newpass" placeholder="Senha (8+ caracteres)"><button onclick="createUser()">CRIAR USUÁRIO</button><div id="users"></div></section></section></main><script>
let token=localStorage.token;const $=id=>document.getElementById(id);async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erro');return d}
async function login(){try{const d=await api('/api/auth/login',{method:'POST',body:{phone:$('phone').value,password:$('password').value}});token=d.token;localStorage.token=token;boot()}catch(e){$('msg').textContent=e.message}}
async function boot(){try{const u=await api('/api/me');$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('who').textContent=u.phone;$('balance').textContent=(u.balance_cents/100).toFixed(2).replace('.',',');if(u.role==='admin'){$('admin').classList.remove('hidden');loadUsers()}const p=await api('/api/packages');$('pkg').innerHTML=p.map(x=>`<option value="${x.price_cents}">${x.name}</option>`).join('');$('opkg').innerHTML=p.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');loadOrders()}catch{logout()}}
function logout(){localStorage.removeItem('token');token=null;location.reload()}function show(x){$('pay').classList.toggle('hidden',x!=='pay');$('order').classList.toggle('hidden',x!=='order')}
async function pix(){try{const d=await api('/api/payments/pix',{method:'POST',body:{amount_cents:Number($('pkg').value),email:$('email').value,cpf:$('cpf').value}});$('pixout').innerHTML=`<p>Status: ${d.status}</p>${d.qr_code_base64?`<img class="qr" src="data:image/png;base64,${d.qr_code_base64}">`:''}<textarea style="width:100%;height:80px">${d.qr_code||''}</textarea><p>Após o pagamento aprovado, o saldo entra automaticamente.</p>`}catch(e){alert(e.message)}}
async function order(){try{await api('/api/orders',{method:'POST',body:{package_id:Number($('opkg').value),group_link:$('link').value.trim()}});alert('Pedido enviado para a fila.');loadOrders();boot()}catch(e){alert(e.message)}}
async function loadOrders(){const a=await api('/api/orders');$('orders').innerHTML=a.map(x=>`<div class="item">#${x.id} — ${x.status} — ${x.package_name}<br><span class="muted">${x.group_link}</span></div>`).join('')||'Nenhum pedido.'}
async function loadUsers(){const a=await api('/api/admin/users');$('users').innerHTML=a.map(x=>`<div class="item">#${x.id} ${x.phone} — R$ ${(x.balance_cents/100).toFixed(2)} <button onclick="addBal(${x.id})">Adicionar R$</button></div>`).join('')}
async function createUser(){try{await api('/api/admin/users',{method:'POST',body:{phone:$('newphone').value,password:$('newpass').value}});loadUsers();alert('Usuário criado')}catch(e){alert(e.message)}}
async function addBal(id){const v=prompt('Valor em reais (use negativo para descontar):','30');if(v===null)return;try{await api('/api/admin/users/'+id+'/balance',{method:'POST',body:{cents:Math.round(Number(v)*100)}});loadUsers()}catch(e){alert(e.message)}}
if(token)boot();
</script></body></html>
